name: Build Radio Palavra Antiga 1.0.6

on:
  push:
    branches:
      - radio-palavra-antiga-build-1.0.6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat radio-build/source.part* | base64 --decode > /tmp/rpa106-source.tar.xz
          echo "922dc1902850e705ebfde52e2c6ef98d047312fa3fa7f367bef90b1b54f0ee20  /tmp/rpa106-source.tar.xz" | sha256sum -c -
          mkdir -p radio-app
          tar -xJf /tmp/rpa106-source.tar.xz -C radio-app
          test -f radio-app/pubspec.yaml
          grep -q '^version: 1.0.6+7$' radio-app/pubspec.yaml

      - name: Restore test-only image assets
        shell: bash
        run: |
          set -euo pipefail
          PNG='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='
          mkdir -p radio-app/assets/images
          printf '%s' "$PNG" | base64 --decode > radio-app/assets/images/logo.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "radio-app/android/app/src/main/res/mipmap-${density}"
            printf '%s' "$PNG" | base64 --decode > "radio-app/android/app/src/main/res/mipmap-${density}/ic_launcher.png"
          done

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-37' 'build-tools;36.0.0'

      - name: Configure Android paths and Gradle wrapper
        working-directory: radio-app
        shell: bash
        run: |
          set -euo pipefail
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_SDK_ROOT" > android/local.properties
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.5.0-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v9.5.0/gradle/wrapper/gradle-wrapper.jar -o android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Resolve Flutter dependencies
        working-directory: radio-app
        run: flutter pub get

      - name: Static analysis
        working-directory: radio-app
        run: flutter analyze --no-pub

      - name: Build debug APK
        working-directory: radio-app
        run: flutter build apk --debug --no-pub

      - name: Validate APK and checksum
        working-directory: radio-app
        shell: bash
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" '../Radio-Palavra-Antiga-1.0.6-debug.apk'
          sha256sum '../Radio-Palavra-Antiga-1.0.6-debug.apk' | tee '../Radio-Palavra-Antiga-1.0.6-debug.sha256'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Palavra-Antiga-1.0.6-debug
          path: |
            Radio-Palavra-Antiga-1.0.6-debug.apk
            Radio-Palavra-Antiga-1.0.6-debug.sha256
          if-no-files-found: error
          retention-days: 14
