name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug instalável
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar APK
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/assistente-whatsapp-ia-v1.0.2.apk

      - name: Guardar APK no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/assistente-whatsapp-ia-v1.0.2.apk
          if ! git diff --cached --quiet; then
            git commit -m "APK 1.0.2 [skip ci]"
            git push
          fi

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: assistente-whatsapp-ia-v1.0.2
          path: releases/assistente-whatsapp-ia-v1.0.2.apk
          if-no-files-found: error
